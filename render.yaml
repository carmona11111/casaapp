# Configuración temporal para desplegar antes de contratar y montar el disco.
# Los datos SQLite se perderán al reiniciar o volver a desplegar este servicio.
services:
  - type: web
    name: casaapp
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_URL
        value: https://casaapp-5tky.onrender.com
