# SQLite y sus archivos WAL deben vivir en el disco persistente de Render.
services:
  - type: web
    name: casaapp
    runtime: node
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: casa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_URL
        value: https://casaapp-5tky.onrender.com
      - key: DATABASE_PATH
        value: /var/data/casa.sqlite
